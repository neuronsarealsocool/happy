name: Android APK Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: android-apk-release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    release-apk:
        name: Build and publish latest APK
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: TypeScript typecheck
              run: pnpm --filter happy-app typecheck

            - name: Generate Android project
              working-directory: packages/happy-app
              env:
                  APP_ENV: production
                  NODE_ENV: production
              run: pnpm exec expo prebuild --platform android --clean --no-install

            - name: Build release APK
              working-directory: packages/happy-app/android
              env:
                  APP_ENV: production
                  HAPPY_DISABLE_UPDATES: "1"
                  HAPPY_LOCAL_EMBEDDED_BUNDLE: "1"
                  NODE_ENV: production
              run: ./gradlew :app:assembleRelease -x lint --no-daemon

            - name: Prepare APK asset
              run: |
                  mkdir -p release
                  cp packages/happy-app/android/app/build/outputs/apk/release/app-release.apk release/happy-android-latest.apk
                  sha256sum release/happy-android-latest.apk > release/happy-android-latest.apk.sha256

            - name: Update latest Android APK release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: android-apk-latest
                  TITLE: Latest Happy Android APK
                  BODY: |
                      Continuously updated Android APK for this Happy fork.

                      Commit: ${{ github.sha }}
                      Branch: ${{ github.ref_name }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$BODY" --prerelease
                  else
                      git tag "$TAG" "$GITHUB_SHA"
                      git push origin "$TAG"
                      gh release create "$TAG" --title "$TITLE" --notes "$BODY" --prerelease
                  fi

                  gh release upload "$TAG" release/happy-android-latest.apk release/happy-android-latest.apk.sha256 --clobber
